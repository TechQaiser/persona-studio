name: Release

# Push a version tag (v0.2.0) to build the Windows app and publish a release
# whose notes come from that version's CHANGELOG section.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches the package version
        shell: bash
        run: |
          want="${TAG#v}"
          have=$(grep -Po '^__version__ = "\K[^"]+' engine/persona/__init__.py)
          [ "$want" = "$have" ] || { echo "tag $TAG but __version__ is $have"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build the dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the engine and build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e "engine[api,launch,dev]" cloakbrowser patchright pyinstaller httpx

      - name: Test the engine
        working-directory: engine
        run: python -m pytest -q

      - name: Build PersonaStudio.exe
        run: pyinstaller packaging/PersonaStudio.spec --noconfirm

      - name: Smoke-test the app
        shell: bash
        run: |
          ./dist/PersonaStudio/PersonaStudio.exe --data-dir "$RUNNER_TEMP/smoke" create smoke --os windows --engine playwright
          ./dist/PersonaStudio/PersonaStudio.exe --data-dir "$RUNNER_TEMP/smoke" engines

      - name: Package
        shell: pwsh
        run: |
          $v = "$env:TAG".TrimStart("v")
          $zip = "PersonaStudio-$v-windows-x64.zip"
          Compress-Archive -Path dist/PersonaStudio -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" | Out-File -Encoding ascii SHA256SUMS.txt
          python packaging/release_notes.py $v notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Persona Studio ${{ env.TAG }}
          body_path: notes.md
          files: |
            PersonaStudio-*-windows-x64.zip
            SHA256SUMS.txt
