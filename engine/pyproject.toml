[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-engine"
version = "0.1.0"
description = "Coherent browser fingerprint & profile engine for Persona."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ahsan" }]
keywords = [
    "browser", "fingerprint", "profile-manager", "anti-detect",
    "multi-account", "privacy", "automation", "playwright",
    "camoufox", "cloakbrowser", "patchright",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/TechQaiser/persona-studio"
Source = "https://github.com/TechQaiser/persona-studio"
Issues = "https://github.com/TechQaiser/persona-studio/issues"

[project.optional-dependencies]
launch = ["playwright>=1.40"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
secure = ["cryptography>=42.0"]
dev = ["pytest>=7.0", "cryptography>=42.0"]

[project.scripts]
persona = "persona.cli:main"

[tool.setuptools.packages.find]
include = ["persona*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
